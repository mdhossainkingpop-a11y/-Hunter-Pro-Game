
name: WORLD LIFE 3D - Godot Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1"

      - name: Download Godot Engine
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64

          echo "$GITHUB_WORKSPACE/godot-bin" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot Export Templates
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" \
            -O templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Project
        run: |
          test -f project.godot || {
            echo "ERROR: project.godot not found!"
            exit 1
          }

          test -f export_presets.cfg || {
            echo "ERROR: export_presets.cfg not found!"
            exit 1
          }

      - name: Import Godot Project
        run: |
          "$GODOT_BIN" --headless --editor --path . --import

      - name: Export Android APK
        run: |
          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug "Android" \
            build/WORLD_LIFE_3D.apk

          test -s build/WORLD_LIFE_3D.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-LIFE-3D-Android-APK
          path: build/WORLD_LIFE_3D.apk
          if-no-files-found: error
          retention-days: 14
