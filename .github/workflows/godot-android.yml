name: WORLD LIFE 3D - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build WORLD LIFE 3D APK and AAB
    runs-on: ubuntu-24.04

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"
      ANDROID_API: "34"
      BUILD_TOOLS: "34.0.0"
      NDK_VERSION: "23.2.8568313"
      CMAKE_VERSION: "3.10.2.4988404"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Do not use android-actions/setup-android here.
      # That action may request the obsolete SDK package named "tools".
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: An executable sdkmanager was not found."
            find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "Android SDK packages installed."

      - name: Download Godot Engine
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download"
          URL="$BASE/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          curl -L --fail --retry 3 "$URL" -o godot.zip
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$GITHUB_WORKSPACE/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable was not found after extraction."
            find godot-bin -maxdepth 3 -type f -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version



      - name: Download and Install Godot Export Templates
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading Godot ${GODOT_VERSION} export templates..."

          BASE="https://github.com/godotengine/godot/releases/download"
          URL="$BASE/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          curl -L --fail --retry 3 "$URL" -o templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          TEMP_DIR="$RUNNER_TEMP/godot-templates"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR" "$TEMPLATE_DIR"

          echo "Extracting export templates..."
          unzip -q templates.tpz -d "$TEMP_DIR"

          # Correct archive structure:
          # templates/version.txt
          SOURCE_DIR="$TEMP_DIR/templates"
          VERSION_FILE="$SOURCE_DIR/version.txt"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: templates directory is missing."
            find "$TEMP_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          if [ ! -s "$VERSION_FILE" ]; then
            echo "ERROR: templates/version.txt is missing or empty."
            find "$TEMP_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          TEMPLATE_VERSION="$(head -n 1 "$VERSION_FILE" | tr -d '\r')"

          echo "Detected template version: $TEMPLATE_VERSION"

          case "$TEMPLATE_VERSION" in
            4.4.1.stable*)
              echo "Godot template version matches."
              ;;
            *)
              echo "ERROR: Expected Godot 4.4.1.stable."
              echo "Found: $TEMPLATE_VERSION"
              exit 1
              ;;
          esac

          echo "Installing templates..."
          cp -a "$SOURCE_DIR/." "$TEMPLATE_DIR/"

          echo "Verifying installed Android templates..."

          for FILE in version.txt android_source.zip android_debug.apk android_release.apk; do
            if [ ! -s "$TEMPLATE_DIR/$FILE" ]; then
              echo "ERROR: Required template file missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

          echo "Installed template version:"
          cat "$TEMPLATE_DIR/version.txt"

          echo "Godot Android export templates installed successfully."


      - name: Configure Godot Android SDK Paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Godot Android SDK paths configured."
          cat "$SETTINGS"

      - name: Set Godot 4.4.1 Compatible Android Target SDK
        shell: bash
        run: |
          set -euo pipefail

          # Godot 4.4.1's Android export platform defaults to API 34.
          # Keep both presets at 34 for this compatible build.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("export_presets.cfg")
          data = path.read_text(encoding="utf-8")
          data, count = re.subn(
              r'(?m)^(gradle_build/target_sdk=)"?36"?$',
              lambda match: match.group(1) + '"34"',
              data
          )
          if count < 2:
              raise SystemExit(
                  f"Expected to update both Android presets from target SDK 36; updated {count}. "
                  "Check export_presets.cfg before continuing."
              )
          path.write_text(data, encoding="utf-8")

          final_data = path.read_text(encoding="utf-8")
          sdk_lines = re.findall(
              r'(?m)^gradle_build/target_sdk="?([^"\\n]+)"?$',
              final_data
          )
          if len(sdk_lines) < 2 or any(value != "34" for value in sdk_lines):
              raise SystemExit(
                  f"Target SDK verification failed. Found values: {sdk_lines}"
              )

          print(f"Updated {count} Android export presets to target SDK 34.")
          PY

          grep -n 'gradle_build/target_sdk' export_presets.cfg

      - name: Verify Godot Project and Export Presets
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg

          grep -Fq 'name="Android APK"' export_presets.cfg
          grep -Fq 'name="Google Play AAB"' export_presets.cfg
          grep -Fq 'gradle_build/use_gradle_build=true' export_presets.cfg

          echo "Godot project and both Android export presets verified."

      
      - name: Create and Configure Project Icon
        shell: bash
        run: |
          set -euo pipefail

          cat > icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="90" fill="#173D2B"/>
            <circle cx="256" cy="256" r="180" fill="#2E7547"/>
            <path d="M256 100 L300 210 L410 256 L300 302 L256 412 L212 302 L102 256 L212 210 Z" fill="#D8F0A8"/>
            <circle cx="256" cy="256" r="55" fill="#173D2B"/>
          </svg>
          SVG

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("project.godot")
          data = path.read_text(encoding="utf-8")

          if not re.search(r'(?m)^config/icon\s*=', data):
              match = re.search(r'(?m)^\[application\]\s*$', data)
              if match:
                  pos = match.end()
                  data = data[:pos] + '\nconfig/icon="res://icon.svg"' + data[pos:]
              else:
                  data += '\n\n[application]\nconfig/icon="res://icon.svg"\n'
          else:
              data = re.sub(
                  r'(?m)^config/icon\s*=.*$',
                  'config/icon="res://icon.svg"',
                  data
              )

          path.write_text(data, encoding="utf-8")
          print("Project icon configured successfully.")
          PY

          grep -n 'config/icon' project.godot
          test -s icon.svg
          
      
      
      - name: Import Godot Project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import

          echo "Godot project import completed."

      
      - name: Install Android Gradle Build Template into Project
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          PROJECT_ANDROID="$GITHUB_WORKSPACE/android"
          BUILD_DIR="$PROJECT_ANDROID/build"
          SOURCE_ZIP="$TEMPLATE_DIR/android_source.zip"

          echo "Checking Android source template..."

          test -s "$SOURCE_ZIP"
          test -s "$TEMPLATE_DIR/version.txt"

          TEMPLATE_VERSION="$(head -n 1 "$TEMPLATE_DIR/version.txt" | tr -d '\r')"

          if [ "$TEMPLATE_VERSION" != "4.4.1.stable" ]; then
            echo "ERROR: Incorrect template version: $TEMPLATE_VERSION"
            exit 1
          fi

          echo "Installing Godot Android Gradle template..."

          mkdir -p "$PROJECT_ANDROID/plugins"
          mkdir -p "$BUILD_DIR"

          # Required Godot project template version metadata.
          printf '%s\n' "$TEMPLATE_VERSION" > "$PROJECT_ANDROID/.build_version"

          # Extract the official Android Gradle source template.
          unzip -oq "$SOURCE_ZIP" -d "$BUILD_DIR"

          # Mark Android build folder as Godot-ignored.
          touch "$BUILD_DIR/.gdignore"

          # Make Gradle wrapper executable.
          test -f "$BUILD_DIR/gradlew"
          chmod +x "$BUILD_DIR/gradlew"

          # Verify required files.
          for FILE in \
            settings.gradle \
            build.gradle \
            config.gradle \
            gradlew \
            gradle/wrapper/gradle-wrapper.properties
          do
            if [ ! -s "$BUILD_DIR/$FILE" ]; then
              echo "ERROR: Missing Gradle file: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

          echo "Installed project build version:"
          cat "$PROJECT_ANDROID/.build_version"

          echo "Godot Android Gradle template installation successful."


      - name: Create Temporary Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android Debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android APK" \
            build/WORLD_LIFE_3D-debug.apk

          test -s build/WORLD_LIFE_3D-debug.apk
          echo "Android debug APK exported."

      - name: Configure Google Play Release Signing
        shell: bash
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_DATA:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: Release signing secrets are missing."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in GitHub Actions secrets."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/worldlife3d-upload.jks"
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Google Play release signing configured."

      - name: Export Signed Google Play AAB
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Google Play AAB" \
            build/WORLD_LIFE_3D-release.aab

          test -s build/WORLD_LIFE_3D-release.aab
          echo "Signed Google Play AAB exported."

      - name: Verify APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          APK="build/WORLD_LIFE_3D-debug.apk"
          AAB="build/WORLD_LIFE_3D-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          test -s "$APK"
          test -s "$AAB"
          test -x "$APKSIGNER"

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "Verifying AAB signature..."
          jarsigner -verify "$AAB"

          echo "APK and AAB verification completed."
          ls -lh build/

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-LIFE-3D-Android-Releases
          path: |
            build/WORLD_LIFE_3D-debug.apk
            build/WORLD_LIFE_3D-release.aab
          if-no-files-found: error
          retention-days: 14
