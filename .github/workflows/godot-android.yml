name: WORLD LIFE 3D - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build WORLD LIFE 3D APK and AAB
    runs-on: ubuntu-24.04

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"
      ANDROID_API: "36"
      BUILD_TOOLS: "36.0.0"
      NDK_VERSION: "23.2.8568313"
      CMAKE_VERSION: "3.10.2.4988404"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is missing or is not executable."
            echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
              -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: ANDROID_HOME and ANDROID_SDK_ROOT are not set."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "Android SDK packages installed."

      - name: Download Godot Engine
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download"
          URL="$BASE/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          curl -L --fail --retry 3 "$URL" -o godot.zip
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$GITHUB_WORKSPACE/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable was not found after extraction."
            find godot-bin -maxdepth 3 -type f -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Download and Install Godot Export Templates
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download"
          URL="$BASE/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          curl -L --fail --retry 3 "$URL" -o templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          TEMP_DIR="$RUNNER_TEMP/godot-templates"

          mkdir -p "$TEMPLATE_DIR" "$TEMP_DIR"
          unzip -q templates.tpz -d "$TEMP_DIR"

          if [ ! -d "$TEMP_DIR/templates" ]; then
            echo "ERROR: The export template archive has no templates directory."
            find "$TEMP_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          cp -a "$TEMP_DIR/templates/." "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_source.zip"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Godot Android export templates installed."

      - name: Configure Godot Android SDK Paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Godot Android SDK paths configured."
          cat "$SETTINGS"

      - name: Verify Godot Project and Export Presets
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg

          grep -Fq 'name="Android APK"' export_presets.cfg
          grep -Fq 'name="Google Play AAB"' export_presets.cfg
          grep -Fq 'gradle_build/use_gradle_build=true' export_presets.cfg

          echo "Godot project and both Android export presets verified."

      - name: Import Godot Project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import

          echo "Godot project import completed."

      - name: Create Temporary Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android Debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android APK" \
            build/WORLD_LIFE_3D-debug.apk

          test -s build/WORLD_LIFE_3D-debug.apk
          echo "Android debug APK exported."

      - name: Configure Google Play Release Signing
        shell: bash
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_DATA:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: Release signing secrets are missing."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in GitHub Actions secrets."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/worldlife3d-upload.jks"
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Google Play release signing configured."

      - name: Export Signed Google Play AAB
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Google Play AAB" \
            build/WORLD_LIFE_3D-release.aab

          test -s build/WORLD_LIFE_3D-release.aab
          echo "Signed Google Play AAB exported."

      - name: Verify APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          APK="build/WORLD_LIFE_3D-debug.apk"
          AAB="build/WORLD_LIFE_3D-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          test -s "$APK"
          test -s "$AAB"
          test -x "$APKSIGNER"

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "Verifying AAB signature..."
          jarsigner -verify "$AAB"

          echo "APK and AAB verification completed."
          ls -lh build/

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-LIFE-3D-Android-Releases
          path: |
            build/WORLD_LIFE_3D-debug.apk
            build/WORLD_LIFE_3D-release.aab
          if-no-files-found: error
          retention-days: 14
