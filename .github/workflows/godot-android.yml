
name: WORLD LIFE 3D - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build WORLD LIFE 3D APK and AAB
    runs-on: ubuntu-24.04

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"
      ANDROID_API: "36"
      BUILD_TOOLS: "36.0.0"
      NDK_VERSION: "23.2.8568313"
      CMAKE_VERSION: "3.10.2.4988404"

    steps:
      # 1. Download project
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Check Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found."
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          chmod +x "$SDKMANAGER"
          "$SDKMANAGER" --version

      # 4. Accept SDK licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      # 5. Install Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmdline-tools;latest" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "Android SDK packages installed."

      # 6. Download Godot
      - name: Download Godot Engine
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download"
          URL="$BASE/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          wget -q "$URL" -O godot.zip

          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$GITHUB_WORKSPACE/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      # 7. Download Godot export templates
      - name: Download Godot Export Templates
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download"
          URL="$BASE/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          wget -q "$URL" -O templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_source.zip"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Godot export templates installed."

      # 8. Configure Godot Android SDK paths
      - name: Configure Godot Editor Settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Godot Android paths configured."
          cat "$SETTINGS"

      # 9. Verify project files and export presets
      - name: Verify Godot Project
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg

          grep -q 'name="Android APK"' export_presets.cfg
          grep -q 'name="Google Play AAB"' export_presets.cfg

          grep -q 'gradle_build/use_gradle_build=true' export_presets.cfg

          echo "Project and both Android presets verified."

      # 10. Import Godot project
      - name: Import Godot Project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import

          echo "Godot project import completed."

      # 11. Create temporary debug keystore
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 12. Export Android APK
      - name: Export Android Debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android APK" \
            build/WORLD_LIFE_3D-debug.apk

          test -s build/WORLD_LIFE_3D-debug.apk

          echo "Android APK exported."

      # 13. Configure release signing
      - name: Configure Release Signing
        shell: bash
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_DATA" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Release signing secrets are missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/worldlife3d-upload.jks"

          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "Release signing configured."

      # 14. Export signed Google Play AAB
      - name: Export Google Play AAB
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Google Play AAB" \
            build/WORLD_LIFE_3D-release.aab

          test -s build/WORLD_LIFE_3D-release.aab

          echo "Google Play AAB exported."

      # 15. Verify APK and AAB
      - name: Verify Android Builds
        shell: bash
        run: |
          set -euo pipefail

          test -s build/WORLD_LIFE_3D-debug.apk
          test -s build/WORLD_LIFE_3D-release.aab

          echo "Checking APK signature..."
          apksigner verify build/WORLD_LIFE_3D-debug.apk

          echo "Checking AAB signature..."
          jarsigner -verify build/WORLD_LIFE_3D-release.aab

          echo "Both Android files passed basic verification."

          ls -lh build/

      # 16. Upload build files
      - name: Upload Android Releases
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-LIFE-3D-Android-Releases
          path: |
            build/WORLD_LIFE_3D-debug.apk
            build/WORLD_LIFE_3D-release.aab
          if-no-files-found: error
          retention-days: 14
